<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1800 1100"
     font-family="Helvetica, Arial, sans-serif"
     font-size="13">

  <!--
    RISC-V RV32I single-cycle datapath schematic
    Organised left-to-right by pipeline stage (IF, ID, EX, MEM, WB).
    Each module is a <g class="module"> so new blocks can be cloned easily.
    Wires use class="wire" / "ctrl" / "bus" for consistent styling.
  -->

  <defs>
    <!-- Arrow heads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-bus" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>

    <!-- Reusable styles -->
    <style><![CDATA[
      .module       { fill:#f8fafc; stroke:#0f172a; stroke-width:1.6; }
      .module-mem   { fill:#fef3c7; stroke:#92400e; stroke-width:1.6; }
      .module-reg   { fill:#dbeafe; stroke:#1e3a8a; stroke-width:1.6; }
      .module-ctrl  { fill:#ffe4e6; stroke:#9f1239; stroke-width:1.6; }
      .module-alu   { fill:#dcfce7; stroke:#14532d; stroke-width:1.6; }
      .mux          { fill:#e9d5ff; stroke:#581c87; stroke-width:1.6; }

      .title        { font-size:16px; font-weight:700; fill:#0f172a; }
      .submodule    { font-size:11px; fill:#475569; }
      .pin          { font-size:11px; fill:#1f2937; }
      .label        { font-size:11px; fill:#0f172a; }
      .stage        { font-size:18px; font-weight:700; fill:#334155;
                      letter-spacing:2px; }

      .wire         { stroke:#222;    stroke-width:1.6; fill:none;
                      marker-end:url(#arrow); }
      .bus          { stroke:#1d4ed8; stroke-width:2.2; fill:none;
                      marker-end:url(#arrow-bus); }
      .ctrl         { stroke:#c2410c; stroke-width:1.4; fill:none;
                      stroke-dasharray:6 4; marker-end:url(#arrow-ctrl); }
      .nojoin       { marker-end:none; }
      .junction     { fill:#222; }
    ]]></style>
  </defs>

  <!-- =================================================================== -->
  <!-- Title                                                               -->
  <!-- =================================================================== -->
  <text x="900" y="34" text-anchor="middle"
        font-size="22" font-weight="700" fill="#0f172a">
    RISC-V RV32I Single-Cycle Datapath
  </text>
  <text x="900" y="56" text-anchor="middle" fill="#475569">
    top.sv  •  data path (solid), control path (dashed)
  </text>

  <!-- =================================================================== -->
  <!-- Stage banners                                                       -->
  <!-- =================================================================== -->
  <g opacity="0.5">
    <line x1="60"  y1="90"  x2="60"  y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
    <line x1="340" y1="90"  x2="340" y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
    <line x1="660" y1="90"  x2="660" y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
    <line x1="1080" y1="90" x2="1080" y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
    <line x1="1420" y1="90" x2="1420" y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
    <line x1="1760" y1="90" x2="1760" y2="1060" stroke="#cbd5e1" stroke-dasharray="2 4"/>
  </g>
  <text x="200"  y="86" class="stage" text-anchor="middle">IF</text>
  <text x="500"  y="86" class="stage" text-anchor="middle">ID</text>
  <text x="870"  y="86" class="stage" text-anchor="middle">EX</text>
  <text x="1250" y="86" class="stage" text-anchor="middle">MEM</text>
  <text x="1590" y="86" class="stage" text-anchor="middle">WB</text>

  <!-- =================================================================== -->
  <!-- IF: PC register + next_pc mux + Fetch + Instruction Memory          -->
  <!-- =================================================================== -->

  <!-- PC register -->
  <g id="pc">
    <rect class="module-reg" x="100" y="380" width="120" height="80" rx="6"/>
    <text x="160" y="408" class="title" text-anchor="middle">PC</text>
    <text x="160" y="428" class="submodule" text-anchor="middle">32-bit reg</text>
    <text x="160" y="446" class="submodule" text-anchor="middle">top.sv</text>
  </g>

  <!-- next_pc mux -->
  <g id="next-pc-mux">
    <polygon class="mux" points="280,360 320,380 320,460 280,480"/>
    <text x="300" y="415" class="label" text-anchor="middle">next</text>
    <text x="300" y="430" class="label" text-anchor="middle">PC</text>
    <text x="300" y="445" class="label" text-anchor="middle">mux</text>
    <text x="270" y="375" class="pin" text-anchor="end">pc+4</text>
    <text x="270" y="475" class="pin" text-anchor="end">{alu[31:1],0}</text>
  </g>

  <!-- Fetch -->
  <g id="fetch">
    <rect class="module" x="100" y="200" width="160" height="100" rx="6"/>
    <text x="180" y="230" class="title" text-anchor="middle">Fetch</text>
    <text x="180" y="250" class="submodule" text-anchor="middle">fetch.sv</text>
    <text x="180" y="270" class="submodule" text-anchor="middle">pc → imem_addr</text>
    <text x="180" y="286" class="submodule" text-anchor="middle">imem_data → instr</text>
  </g>

  <!-- Instruction memory -->
  <g id="imem">
    <rect class="module-mem" x="100" y="540" width="160" height="100" rx="6"/>
    <text x="180" y="570" class="title" text-anchor="middle">Instr Memory</text>
    <text x="180" y="590" class="submodule" text-anchor="middle">instruction_memory.sv</text>
    <text x="180" y="608" class="submodule" text-anchor="middle">128 B ROM</text>
    <text x="180" y="624" class="submodule" text-anchor="middle">$readmemh</text>
  </g>

  <!-- IF wiring -->
  <!-- PC -> next_pc mux feedback (pc+4 path computed in top.sv) -->
  <path class="bus" d="M 220,400 L 250,400 L 250,370 L 280,370"/>
  <text x="252" y="362" class="pin">+4</text>

  <!-- next_pc mux -> PC -->
  <path class="bus" d="M 320,420 L 360,420 L 360,500 L 80,500 L 80,420 L 100,420"/>
  <text x="86" y="514" class="pin">next_pc</text>

  <!-- PC -> Fetch -->
  <path class="bus" d="M 160,380 L 160,300"/>

  <!-- PC -> Imem (via fetch.imem_addr) -->
  <path class="bus" d="M 160,460 L 160,540"/>

  <!-- Imem data -> Fetch (instruction) -->
  <path class="bus" d="M 220,540 L 240,540 L 240,300"/>

  <!-- Fetch instruction out -->
  <path class="bus" d="M 260,250 L 380,250"/>
  <text x="320" y="242" class="pin">instruction[31:0]</text>

  <!-- =================================================================== -->
  <!-- ID: Decode + Register File + Control Unit                           -->
  <!-- =================================================================== -->

  <!-- Decode -->
  <g id="decode">
    <rect class="module" x="380" y="180" width="200" height="160" rx="6"/>
    <text x="480" y="208" class="title" text-anchor="middle">Decode</text>
    <text x="480" y="228" class="submodule" text-anchor="middle">decode.sv</text>
    <text x="480" y="252" class="submodule" text-anchor="middle">opcode, funct3, funct7</text>
    <text x="480" y="270" class="submodule" text-anchor="middle">rs1, rs2, rd</text>
    <text x="480" y="288" class="submodule" text-anchor="middle">imm I/S/B/U/J</text>
    <text x="480" y="306" class="submodule" text-anchor="middle">r/i/s/b/u/j_type</text>
  </g>

  <!-- Register File -->
  <g id="regfile">
    <rect class="module-reg" x="380" y="430" width="220" height="180" rx="6"/>
    <text x="490" y="458" class="title" text-anchor="middle">Register File</text>
    <text x="490" y="478" class="submodule" text-anchor="middle">register_file.sv</text>
    <text x="490" y="498" class="submodule" text-anchor="middle">32 × 32-bit</text>
    <text x="490" y="516" class="submodule" text-anchor="middle">x0 hardwired 0</text>
    <text x="395" y="540" class="pin">rs1_addr</text>
    <text x="395" y="558" class="pin">rs2_addr</text>
    <text x="395" y="576" class="pin">rd_addr</text>
    <text x="395" y="594" class="pin">wr_data</text>
    <text x="585" y="540" class="pin" text-anchor="end">rs1_data</text>
    <text x="585" y="558" class="pin" text-anchor="end">rs2_data</text>
  </g>

  <!-- Control Unit -->
  <g id="control">
    <rect class="module-ctrl" x="380" y="720" width="220" height="180" rx="6"/>
    <text x="490" y="748" class="title" text-anchor="middle">Control Unit</text>
    <text x="490" y="768" class="submodule" text-anchor="middle">control.sv</text>
    <text x="490" y="788" class="submodule" text-anchor="middle">ctrl_r/i/s/b/u/j → ctrl</text>
    <text x="490" y="806" class="submodule" text-anchor="middle">muxes final control_t</text>
    <text x="490" y="830" class="submodule" text-anchor="middle">pc_sel, op1/op2_sel</text>
    <text x="490" y="848" class="submodule" text-anchor="middle">alu_op, wb_src</text>
    <text x="490" y="866" class="submodule" text-anchor="middle">dmem_*, rf_wr_en</text>
  </g>

  <!-- ID wiring -->
  <!-- rs1_addr, rs2_addr, rd_addr from decode -> register file -->
  <path class="wire" d="M 430,340 L 430,430"/>
  <text x="408" y="358" class="pin">rs1</text>
  <path class="wire" d="M 480,340 L 480,430"/>
  <text x="486" y="358" class="pin">rs2</text>
  <path class="wire" d="M 530,340 L 530,430"/>
  <text x="536" y="358" class="pin">rd</text>

  <!-- opcode/funct3/funct7 + type flags from decode -> control -->
  <path class="ctrl" d="M 560,340 L 620,340 L 620,720"/>
  <text x="624" y="700" class="pin" fill="#9a3412">opcode, funct3/7</text>
  <text x="624" y="714" class="pin" fill="#9a3412">r/i/s/b/u/j_type</text>

  <!-- =================================================================== -->
  <!-- EX: operand muxes + ALU + Branch Control                            -->
  <!-- =================================================================== -->

  <!-- Operand A mux -->
  <g id="mux-a">
    <polygon class="mux" points="780,300 820,320 820,400 780,420"/>
    <text x="800" y="358" class="label" text-anchor="middle">mux</text>
    <text x="800" y="372" class="label" text-anchor="middle">A</text>
    <text x="770" y="315" class="pin" text-anchor="end">rs1</text>
    <text x="770" y="415" class="pin" text-anchor="end">PC</text>
    <text x="800" y="290" class="pin" text-anchor="middle" fill="#9a3412">op1_sel</text>
  </g>

  <!-- Operand B mux -->
  <g id="mux-b">
    <polygon class="mux" points="780,500 820,520 820,600 780,620"/>
    <text x="800" y="558" class="label" text-anchor="middle">mux</text>
    <text x="800" y="572" class="label" text-anchor="middle">B</text>
    <text x="770" y="515" class="pin" text-anchor="end">rs2</text>
    <text x="770" y="615" class="pin" text-anchor="end">imm</text>
    <text x="800" y="490" class="pin" text-anchor="middle" fill="#9a3412">op2_sel</text>
  </g>

  <!-- ALU -->
  <g id="alu">
    <polygon class="module-alu" points="900,330 1020,360 1020,580 900,610 900,500 880,470 900,440"/>
    <text x="960" y="430" class="title" text-anchor="middle">ALU</text>
    <text x="960" y="450" class="submodule" text-anchor="middle">alu.sv</text>
    <text x="960" y="470" class="submodule" text-anchor="middle">ADD SUB SLL SRL SRA</text>
    <text x="960" y="488" class="submodule" text-anchor="middle">AND OR XOR</text>
    <text x="960" y="506" class="submodule" text-anchor="middle">SLT SLTU</text>
  </g>

  <!-- Branch control -->
  <g id="branch">
    <rect class="module-ctrl" x="880" y="700" width="200" height="120" rx="6"/>
    <text x="980" y="728" class="title" text-anchor="middle">Branch Control</text>
    <text x="980" y="748" class="submodule" text-anchor="middle">branch_control.sv</text>
    <text x="980" y="768" class="submodule" text-anchor="middle">BEQ BNE BLT BGE</text>
    <text x="980" y="786" class="submodule" text-anchor="middle">BLTU BGEU</text>
    <text x="980" y="806" class="submodule" text-anchor="middle">→ branch_taken</text>
  </g>

  <!-- EX wiring -->
  <!-- rs1_data -> mux-A and branch -->
  <path class="bus" d="M 600,540 L 700,540 L 700,310 L 780,310"/>
  <text x="710" y="304" class="pin">rs1_data</text>
  <circle class="junction" cx="700" cy="540" r="3"/>
  <path class="bus" d="M 700,540 L 700,720 L 880,720"/>

  <!-- rs2_data -> mux-B and branch -->
  <path class="bus" d="M 600,558 L 730,558 L 730,510 L 780,510"/>
  <text x="740" y="504" class="pin">rs2_data</text>
  <circle class="junction" cx="730" cy="558" r="3"/>
  <path class="bus" d="M 730,558 L 730,740 L 880,740"/>

  <!-- PC -> mux-A bottom -->
  <path class="bus" d="M 220,420 L 360,420 L 360,410 L 780,410"/>
  <text x="600" y="404" class="pin">pc</text>

  <!-- immediate -> mux-B bottom -->
  <path class="bus" d="M 580,290 L 660,290 L 660,610 L 780,610"/>
  <text x="666" y="284" class="pin">immediate</text>

  <!-- mux-A -> ALU -->
  <path class="bus" d="M 820,360 L 900,360"/>
  <!-- mux-B -> ALU -->
  <path class="bus" d="M 820,560 L 850,560 L 850,580 L 900,580"/>

  <!-- Control -> EX signals -->
  <path class="ctrl" d="M 600,750 L 800,750 L 800,640" />
  <text x="700" y="744" class="pin" fill="#9a3412">op2_sel</text>
  <path class="ctrl" d="M 600,770 L 770,770 L 770,440 L 800,440"/>
  <text x="700" y="764" class="pin" fill="#9a3412">op1_sel</text>
  <path class="ctrl" d="M 600,790 L 760,790 L 760,500 L 880,500"/>
  <text x="700" y="784" class="pin" fill="#9a3412">alu_op</text>
  <path class="ctrl" d="M 600,810 L 750,810 L 750,805 L 880,805"/>
  <text x="700" y="804" class="pin" fill="#9a3412">b_type/funct3</text>

  <!-- =================================================================== -->
  <!-- MEM: Data memory                                                    -->
  <!-- =================================================================== -->

  <g id="dmem">
    <rect class="module-mem" x="1140" y="440" width="220" height="180" rx="6"/>
    <text x="1250" y="468" class="title" text-anchor="middle">Data Memory</text>
    <text x="1250" y="488" class="submodule" text-anchor="middle">data_memory.sv</text>
    <text x="1250" y="508" class="submodule" text-anchor="middle">64 B RAM</text>
    <text x="1250" y="526" class="submodule" text-anchor="middle">BYTE / HALF / WORD</text>
    <text x="1250" y="544" class="submodule" text-anchor="middle">sign/zero extend</text>
    <text x="1150" y="568" class="pin">addr</text>
    <text x="1150" y="586" class="pin">wr_data</text>
    <text x="1350" y="568" class="pin" text-anchor="end">rd_data</text>
  </g>

  <!-- ALU result -> dmem addr (and forward to WB / next_pc) -->
  <path class="bus" d="M 1020,470 L 1100,470 L 1100,565 L 1140,565"/>
  <text x="1030" y="464" class="pin">alu_res → addr</text>
  <circle class="junction" cx="1100" cy="470" r="3"/>

  <!-- ALU result -> branch/jump target back to next_pc mux -->
  <path class="bus" d="M 1100,470 L 1100,360 L 1060,360 L 1060,210 L 300,210 L 300,360"/>
  <text x="660" y="204" class="pin">{alu_res[31:1],0} (branch/jump target)</text>

  <!-- rs2_data -> dmem wr_data -->
  <path class="bus" d="M 730,558 L 730,640 L 1120,640 L 1120,585 L 1140,585"/>
  <text x="900" y="634" class="pin">rs2_data → store</text>

  <!-- Control -> dmem -->
  <path class="ctrl" d="M 600,830 L 1130,830 L 1130,610 L 1140,610"/>
  <text x="900" y="824" class="pin" fill="#9a3412">dmem_req, wr_en, size, zero_ext</text>

  <!-- branch_taken / pc_sel -> next_pc select -->
  <path class="ctrl" d="M 1080,760 L 1110,760 L 1110,170 L 300,170 L 300,358"/>
  <text x="700" y="164" class="pin" fill="#9a3412">branch_taken | pc_sel</text>

  <!-- =================================================================== -->
  <!-- WB: writeback mux back to register file                             -->
  <!-- =================================================================== -->

  <g id="wb-mux">
    <polygon class="mux" points="1480,400 1540,420 1540,620 1480,640"/>
    <text x="1510" y="510" class="label" text-anchor="middle">WB</text>
    <text x="1510" y="526" class="label" text-anchor="middle">mux</text>
    <text x="1470" y="415" class="pin" text-anchor="end">alu</text>
    <text x="1470" y="473" class="pin" text-anchor="end">mem</text>
    <text x="1470" y="565" class="pin" text-anchor="end">imm</text>
    <text x="1470" y="635" class="pin" text-anchor="end">pc+4</text>
    <text x="1510" y="390" class="pin" text-anchor="middle" fill="#9a3412">wb_src</text>
  </g>

  <!-- inputs to wb mux -->
  <path class="bus" d="M 1020,470 L 1100,470 L 1100,415 L 1480,415"/>
  <path class="bus" d="M 1360,565 L 1400,565 L 1400,470 L 1480,470"/>
  <text x="1370" y="558" class="pin">dmem_rd_data</text>

  <path class="bus" d="M 580,290 L 580,170 L 1440,170 L 1440,560 L 1480,560"/>
  <text x="1340" y="164" class="pin">immediate (LUI)</text>

  <path class="bus" d="M 220,400 L 250,400 L 250,140 L 1460,140 L 1460,635 L 1480,635"/>
  <text x="1340" y="134" class="pin">next_seq_pc (pc+4)</text>

  <!-- wb mux output -> register file wr_data -->
  <path class="bus" d="M 1540,520 L 1620,520 L 1620,930 L 360,930 L 360,594 L 380,594"/>
  <text x="900" y="924" class="pin">wr_data → register file</text>

  <!-- control -> wb_src + rf_wr_en -->
  <path class="ctrl" d="M 600,855 L 1420,855 L 1420,400"/>
  <text x="1000" y="850" class="pin" fill="#9a3412">wb_src</text>
  <path class="ctrl" d="M 600,875 L 340,875 L 340,610 L 380,610"/>
  <text x="370" y="870" class="pin" fill="#9a3412">rf_wr_en</text>

  <!-- =================================================================== -->
  <!-- Legend                                                              -->
  <!-- =================================================================== -->
  <g id="legend" transform="translate(1140,940)">
    <rect x="0" y="0" width="620" height="110" rx="8"
          fill="#ffffff" stroke="#94a3b8"/>
    <text x="14" y="22" font-weight="700" fill="#0f172a">Legend</text>

    <line x1="20" y1="44" x2="80" y2="44" class="bus"/>
    <text x="92" y="48" class="label">data / bus (32-bit)</text>

    <line x1="220" y1="44" x2="280" y2="44" class="wire"/>
    <text x="292" y="48" class="label">narrow signal</text>

    <line x1="420" y1="44" x2="480" y2="44" class="ctrl"/>
    <text x="492" y="48" class="label">control signal</text>

    <rect x="20" y="70" width="22" height="14" class="module"/>
    <text x="48" y="82" class="label">logic</text>
    <rect x="100" y="70" width="22" height="14" class="module-reg"/>
    <text x="128" y="82" class="label">register</text>
    <rect x="200" y="70" width="22" height="14" class="module-mem"/>
    <text x="228" y="82" class="label">memory</text>
    <rect x="300" y="70" width="22" height="14" class="module-ctrl"/>
    <text x="328" y="82" class="label">control</text>
    <rect x="400" y="70" width="22" height="14" class="module-alu"/>
    <text x="428" y="82" class="label">ALU</text>
    <polygon class="mux" points="500,70 522,77 522,84 500,91"/>
    <text x="532" y="82" class="label">mux</text>
  </g>

</svg>
